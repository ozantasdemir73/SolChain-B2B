<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SolChain B2B Üretici Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: kurumsal uygulama kabuğu; solda koyu gezinme, üstte durum çubuğu, sağda görünüm alanı; tedarikçi profili sağdan açılan çekmece */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --raised:#f8fafb; --fg:#101a20; --muted:#55636d; --faint:#8a97a2; --line:#d8dfe4; --soft:#e9eef1; --grid:#e4e9ed;
  --nav:#0f1c22; --nav-fg:#c7d3da; --nav-mut:#7f919c; --nav-act:#1b2f37;
  --brand:#0d6b6e; --brand-soft:#dbeeed; --accent:#b3650f; --accent-soft:#f6e9d8;
  --s1:#2a78d6; --s2:#eb6834;
  --ok:#137a32; --ok-soft:#e0f1e4; --bad:#b8352b; --bad-soft:#f8e1de; --warn:#94600a; --warn-soft:#f5ebd6;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1216; --surface:#141c21; --raised:#18222a; --fg:#e3eaee; --muted:#9fb0ba; --faint:#6f808b; --line:#26323a; --soft:#1d2830; --grid:#212d35;
  --nav:#080d10; --nav-fg:#c7d3da; --nav-mut:#6f808b; --nav-act:#16252c;
  --brand:#5fc4c4; --brand-soft:#123232; --accent:#e5a35a; --accent-soft:#36271a;
  --s1:#3987e5; --s2:#d95926;
  --ok:#5fcb7c; --ok-soft:#163222; --bad:#ee7b70; --bad-soft:#3a1d1a; --warn:#e3b05a; --warn-soft:#342a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1216; --surface:#141c21; --raised:#18222a; --fg:#e3eaee; --muted:#9fb0ba; --faint:#6f808b; --line:#26323a; --soft:#1d2830; --grid:#212d35;
  --nav:#080d10; --nav-fg:#c7d3da; --nav-mut:#6f808b; --nav-act:#16252c;
  --brand:#5fc4c4; --brand-soft:#123232; --accent:#e5a35a; --accent-soft:#36271a;
  --s1:#3987e5; --s2:#d95926;
  --ok:#5fcb7c; --ok-soft:#163222; --bad:#ee7b70; --bad-soft:#3a1d1a; --warn:#e3b05a; --warn-soft:#342a17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--nav)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
@media (max-width:900px){.app{grid-template-columns:1fr}}
/* gezinme */
.side{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding:18px 12px 18px max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
@media (max-width:900px){.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;color:#fff}
.brand b span{color:#5fc4c4}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--nav-mut);letter-spacing:.05em}
.navg{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.navg{flex-direction:row;flex-wrap:wrap}}
.navg .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-mut);padding:10px 10px 4px}
@media (max-width:900px){.navg .lbl{display:none}}
.navg a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--nav-fg);text-decoration:none;padding:8px 10px;border-radius:7px;font-size:13.5px}
.navg a:hover{background:var(--nav-act)}
.navg a[aria-current="page"]{background:var(--nav-act);color:#fff;box-shadow:inset 3px 0 0 #5fc4c4}
.navg a .ct{font-family:var(--mono);font-size:11px;background:#5fc4c4;color:#0f1c22;border-radius:9px;padding:0 6px}
.sidefoot{margin-top:auto;font-size:11.5px;color:var(--nav-mut);padding:0 8px;display:flex;flex-direction:column;gap:6px}
@media (max-width:900px){.sidefoot{display:none}}
.sidefoot .net{display:flex;align-items:center;gap:6px;color:var(--nav-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:#5fcb7c;box-shadow:0 0 0 3px rgba(95,203,124,.2)}
/* üst çubuk */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--fg)}
.topr{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--muted)}
.user{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);line-height:1.3}
.user b{display:block;color:var(--fg);font-size:12.5px}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px}
.view{padding:22px max(20px,env(safe-area-inset-right,0px)) 60px 20px;display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
@media (max-width:900px){.view{padding-left:max(16px,env(safe-area-inset-left,0px))}}
/* tipografi ve bloklar */
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,28px);line-height:1.15;margin:0}
h2{font-family:var(--display);font-weight:700;font-size:15.5px;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:14px;margin:0}
p{margin:0}
.vh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.vh p{color:var(--muted);max-width:80ch;margin-top:4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.foot,.note{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{font-size:12px;color:var(--muted)}
.btn{cursor:pointer;border-radius:7px;padding:8px 13px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.pri{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.br{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.br{background:var(--brand-soft);color:var(--brand)}.pill.neu{background:var(--soft);color:var(--muted)}
.tag{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--raised);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{white-space:nowrap}
.rowlink{cursor:pointer}
.rowlink:hover td{background:var(--raised)}
.rowlink.sel td{background:var(--brand-soft)}
.track{height:7px;border-radius:4px;background:var(--soft);position:relative;overflow:hidden;min-width:60px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.crow{display:grid;grid-template-columns:minmax(0,1.4fr) 38px minmax(0,1.3fr) 48px;gap:10px;align-items:center;font-size:13px}
.crow .w{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.crow .v{font-family:var(--mono);font-size:12.5px;text-align:right}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700}
.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.br{background:var(--brand-soft);color:var(--brand)}.ic.bad{background:var(--bad-soft);color:var(--bad)}.ic.ok{background:var(--ok-soft);color:var(--ok)}
.li b{display:block;font-size:13.5px;font-weight:600}
.li span{font-size:12.5px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--surface);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.swl{display:inline-block;width:14px;border-top:2px dashed var(--faint);margin-right:5px;vertical-align:3px}
/* form */
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
@media (max-width:860px){.wiz{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.steps{flex-direction:row;flex-wrap:wrap}}
.steps button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--fg);font-weight:600}
.steps .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;border:1.5px solid var(--line);flex:none}
.steps button.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.field b{color:var(--fg);font-weight:600}
.field input[type=number],.field input[type=text],.field select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--fg);font-size:13.5px}
.field input[type=range]{accent-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--fg);background:var(--surface)}
.opt input{accent-color:var(--brand);margin:0}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line);font-size:13px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--surface)}
.ptable input{width:110px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}
.ptable input.w{width:56px}
.summ{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.summ div{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.summ span{display:block;font-size:11.5px;color:var(--muted)}
.summ b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
/* teklifler */
.offer{display:grid;grid-template-columns:28px minmax(0,1fr) 190px;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.offer.best{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
@media (max-width:760px){.offer{grid-template-columns:24px minmax(0,1fr)}.offer .orr{grid-column:2}}
.offer .rk{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.offer .nm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600;font-size:14.5px}
.offer .nm small{font-weight:400;color:var(--muted);font-size:12px}
.offer .why{font-size:12.5px;color:var(--muted);margin-top:3px}
.ogrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:1100px){.ogrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ogrid div{background:var(--raised);border-radius:6px;padding:6px 8px;min-width:0}
.ogrid span{display:block;font-size:11px;color:var(--muted)}
.ogrid b{font-family:var(--mono);font-weight:500;font-size:12.5px;overflow-wrap:anywhere}
.orr{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.msc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.msc b{display:block;font-family:var(--display);font-size:22px;color:var(--fg)}
.elim{font-size:12.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.elim b{color:var(--bad)}
/* sipariş */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:11px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .d{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.tl li.done .d{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.cur .d{border-color:var(--accent);color:var(--accent)}
.tl li.pend{opacity:.6}
.tl b{font-size:13.5px;display:block}
.tl span{font-size:12px;color:var(--muted)}
.tl code{font-family:var(--mono);font-size:11.5px;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mb{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mb span{font-size:11.5px;color:var(--muted)}
.mb b{font-family:var(--mono);font-weight:500;font-size:13px;overflow-wrap:anywhere}
.callout{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.callout b{color:var(--brand)}
textarea{width:100%;min-height:200px;resize:vertical;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--raised)}
.verdict{border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.bad{background:var(--bad-soft);color:var(--bad)}.verdict.neu{background:var(--soft);color:var(--muted)}
code.h{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
/* çekmece */
.scrim{position:fixed;inset:0;background:rgba(8,13,16,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:51;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--surface);border-radius:8px;padding:10px 14px;font-size:13px;z-index:60;max-width:min(420px,calc(100% - 36px));box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast code{font-family:var(--mono);font-size:11.5px;opacity:.8}
.proto{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="11" width="18" height="12" rx="6" fill="none" stroke="#fff" stroke-width="3"/><rect x="13" y="11" width="18" height="12" rx="6" fill="none" stroke="#5fc4c4" stroke-width="3"/></svg><div><b>SolChain <span>B2B</span></b><small>Üretici paneli</small></div></div>
    <nav class="navg" id="nav" aria-label="Ana gezinme"></nav>
    <div class="sidefoot"><span class="net"><span class="dot"></span>Solana ağına bağlı</span><span>Ödeme yolu: lisanslı ödeme kuruluşu (TRY)</span><span class="proto">Prototip · örnek veriler</span></div>
  </aside>
  <div class="main">

function advance(o,action,time){
  var s=supById(o.sup),t=time||new Date(TODAY);
  if(o.stage===0){tx(o,'sign_order','Tedarikçi','Tedarikçi aynı koşulları imzaladı',t);o.stage=1;return}
  if(o.stage===1){
    if(o.guar==='kosullu'){o.funds.locked=o.total;tx(o,'attest_funding','Ödeme kuruluşu',tl(o.total)+' emanet hesabında bloke edildi',t)}
    else if(o.guar==='teminat')tx(o,'attest_guarantee','Banka','Teminat mektubu kaydedildi: '+tl(o.total)+', vade '+o.vade+' gün',t);
    else if(o.guar==='akreditif')tx(o,'attest_letter_of_credit','Banka','Teyitli akreditif açıldı: '+tl(o.total),t);
    else tx(o,'confirm_open_account','Alıcı','Açık hesap: '+o.vade+' gün vadeli ödeme taahhüdü',t);
    o.stage=2;return}
  if(o.stage===2){o.late=action==='late';o.hashes.ship=sha256('SEVK '+o.id+' '+o.term);
    var adv=o.total*o.adv,pt={EXW:'tedarikçi kapısında taşıyıcıya',FCA:'taşıyıcıya',FOB:'yükleme limanında gemiye',CIF:'yükleme limanında gemiye',DAP:'üretici kapısına',DDP:'üretici kapısına'}[o.term];
    tx(o,'record_shipment','Tedarikçi + e-Belge doğrulayıcı','Sevkiyat kaydı: '+o.term+' gereği teslim noktası '+pt+(o.late?' · termin 3 gün aşıldı':' · zamanında'),t);
    if(adv>0){o.funds.locked-=adv;o.funds.paid+=adv;tx(o,'release_advance','Program','Avans %'+Math.round(o.adv*100)+': '+tl(adv)+' tedarikçiye aktarma talimatı',t)}
    if(o.guar==='akreditif')tx(o,'present_documents','Banka','Akreditif belgeleri (fatura, konşimento, analiz sertifikası) özetleriyle eşleşti',t);
    o.stage=3;return}
  if(o.stage===3){tx(o,'confirm_receipt',o.receiver,'Mal kabul: '+o.qty+' ton teslim alındı · '+o.place,t);o.stage=4;return}
  if(o.stage===4){
    if(action==='dispute'&&!o.dispute){o.dispute='open';tx(o,'open_dispute','Alıcı','Giriş kalite kontrolünde '+CATS[o.cat].params[0][0].toLowerCase()+' şart dışı bildirildi; kalan tutar donduruldu',t);return}
    if(o.dispute==='open'){o.verdict=action;o.dispute='closed';tx(o,'resolve_dispute','Hakem laboratuvar','Hakem kararı: '+(action==='buyer'?'parti şartname dışı, alıcı haklı':'parti uygun, tedarikçi haklı'),t);o.iqc=action==='buyer'?'red':'kabul';o.stage=5;return}
    o.iqc='kabul';tx(o,'accept_delivery','Alıcı','Giriş kalite kontrolü: kabul',t);o.stage=5;return}
  if(o.stage===5){var rest=o.total-o.funds.paid-o.funds.refund;
    if(o.guar==='kosullu'){if(o.iqc==='red'){o.funds.refund+=o.funds.locked}else{o.funds.paid+=o.funds.locked}o.funds.locked=0}
    else if(o.iqc!=='red')o.funds.paid=o.total;
    tx(o,'settle_order','Mutabakat servisi',o.iqc==='red'?'Kalan tutar alıcıya iade edildi; tedarikçi karnesine kaybedilen itiraz işlendi':'Kalan '+tl(rest)+' '+(o.vade?'vade tarihinde':'')+' tedarikçiye aktarılmak üzere talimatlandı; karneler güncellendi',t);
    o.stage=6;return}
  if(o.stage===6&&action){o.field.push({ok:action==='pos',at:new Date(t)});tx(o,'record_field_feedback','Alıcı','Saha geri bildirimi: '+(action==='pos'?'olumlu, kullanımda sorun yok':'olumsuz, kullanımda kusur bildirildi'),t)}
}

function lineChart(box,pts,o){

   '<section class="panel"><div class="ph"><h2>Uyarılar</h2><span class="foot">Olumsuz bilgi yalnızca resmî kaynaktan veya tedarikçinin kendi bildiriminden gelir; tedarikçinin açıklama hakkı vardır.</span></div><div class="tblw"><table><thead><tr><th>Düzey</th><th>Kaynak</th><th>Konu</th><th>Tür</th><th></th></tr></thead><tbody>'+
   al.map(function(a,i){return '<tr><td><span class="pill '+a[0]+'">'+(a[0]==='bad'?'Kritik':'Uyarı')+'</span></td><td>'+esc(a[1])+'</td><td>'+esc(a[2])+'</td><td><span class="tag">'+a[4]+'</span></td><td>'+(a[4]==='belge'?'<button class="btn sm br" data-act="'+a[3]+'">Güncel belge iste</button>':a[3]?'<button class="btn sm" data-sp="'+a[3]+'">Profili aç</button>':'<a class="btn sm" href="#piyasa" style="text-decoration:none">Piyasayı gör</a>')+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
   '<section class="panel"><div class="ph"><h2>Tedarikçi süreklilik tablosu</h2></div><div class="tblw"><table><thead><tr><th>Tedarikçi</th><th>Seviye</th><th class="n">Faaliyet belgesi</th><th>Vergi</th><th>SGK</th><th class="n">Bildirim</th><th class="n">Farklı alıcı</th><th class="n">Kapasite kullanımı</th></tr></thead><tbody>'+
   SUPS.map(function(s){var x=SUPX[s.id],lv=levelOf(s,'metal');return '<tr class="rowlink" data-sp="'+s.id+'"><td>'+esc(supName(s,'metal'))+'</td><td><span class="pill '+lv.c+'">'+lv.n+'</span></td><td class="n">'+(x.act>90?'<b style="color:var(--warn)">'+x.act+' gün</b>':x.act+' gün')+'</td><td>'+(x.tax==='ok'?'Borcu yok':'Borcu var')+'</td><td>'+(x.sgk==='ok'?'Borcu yok':x.sgk==='yap'?'Yapılandırılmış':'Muaf')+'</td><td class="n">'+x.notices.length+'</td><td class="n">'+x.buyers+'</td><td class="n">%'+Math.round(100*s.capAct/s.cap)+'</td></tr>'}).join('')+'</tbody></table></div>'+
   '<p class="foot">Kurallar: faaliyet belgesi ilk kayıtta ve 90 günde bir yenilenir; ilk siparişte, yüksek tutarlı siparişte ve risk sinyalinden sonra güncel belge istenir. Sorununu erken bildiren tedarikçi, gizleyip sonradan tespit edilene göre daha az puan kaybeder.</p></section>';
  V.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){var id=b.dataset.act;SUPX[id].act=0;st.slot+=300;var sig=b58(TX,88);st.txs.unshift({sig:sig,ix:'verify_activity_certificate',order:supName(supById(id),'metal'),who:'Ticaret odası doğrulayıcı',note:'Güncel faaliyet belgesi alındı ve doğrulandı',slot:st.slot,time:new Date(TODAY)});toast('Güncel faaliyet belgesi doğrulandı.',sig);render()}});
  V.querySelectorAll('[data-sp]').forEach(function(b){b.onclick=function(){openSup(b.dataset.sp,'metal')}});
}

/* ================= Piyasa istihbaratı ================= */
function vPiyasa(V){
  var cat=st.kCat,v=MKT[cat],ch=mktChange(cat),lo=Math.floor(Math.min.apply(null,v)*.97),hi=Math.ceil(Math.max.apply(null,v)*1.02),act=SUPS.filter(function(s){return s.cert!=='expired'}).length;
  V.innerHTML='<div class="vh"><div><div class="eyebrow">Ağ</div><h1>Piyasa istihbaratı</h1><p>Ağdaki anonimleştirilmiş tekliflerden ve teslimatlardan üretilen sektör göstergeleri. Bir gösterge yalnızca en az 5 farklı firmanın verisi olduğunda yayınlanır.</p></div><div class="seg" id="pCat">'+CATK.map(function(k){return '<button type="button" data-k="'+k+'" aria-pressed="'+(k===cat)+'">'+CATS[k].name+'</button>'}).join('')+'</div></div>'+
   '<div class="kpis"><div class="kpi"><span>Güncel fiyat endeksi</span><b>'+fmt(v[11],1)+' bin ₺</b><small>'+esc(CATS[cat].mat)+' · ton</small></div><div class="kpi"><span>Son 3 ay</span><b style="color:'+(ch>0?'var(--bad)':'var(--ok)')+'">'+(ch>0?'+':'−')+'%'+fmt(Math.abs(ch),1)+'</b><small>'+(ch>0?'Yükseliş':'Düşüş')+'</small></div><div class="kpi"><span>Aktif tedarikçi</span><b>'+act+'</b><small>Doğrulanmış, belgesi geçerli</small></div><div class="kpi"><span>Ortalama teslim süresi</span><b>12,4 gün</b><small>Son 90 gün</small></div><div class="kpi"><span>Ortalama vade farkı</span><b>%2,8 / ay</b><small>Ağdaki teklifler</small></div></div>'+
   '<div class="g21"><section class="panel"><div class="ph"><h2>Fiyat endeksi · son 12 ay</h2><div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Ağdaki teklif ortalaması, bin TRY/ton</span></div></div><div class="chart" id="pChart"></div></section>'+
   '<section class="panel"><div class="ph"><h2>Öneriler</h2></div><div class="list">'+
    (ch>4?'<div class="li"><span class="ic warn">↑</span><div><b>Fiyatlar yükseliyor</b><span>Alım bağlantısı veya fiyat revizyon bandı ile fiyat riskinizi sınırlayın.</span></div><span></span></div>':ch<-3?'<div class="li"><span class="ic ok">↓</span><div><b>Fiyatlar düşüyor</b><span>Kısa vadeli siparişler ve spot alım avantajlı olabilir.</span></div><span></span></div>':'<div class="li"><span class="ic br">→</span><div><b>Fiyatlar yatay</b><span>Mevcut bağlantı koşullarınız piyasa ile uyumlu.</span></div><span></span></div>')+
    '<div class="li"><span class="ic br">%</span><div><b>Vade karşılaştırması</b><span>Finansman maliyetiniz ağ ortalamasının üzerindeyse uzun vade toplam maliyeti düşürür.</span></div><span></span></div>'+
    '<div class="li"><span class="ic warn">!</span><div><b>Tedarik yoğunlaşması</b><span>Aktif kapasitenin yarısından fazlası Marmara bölgesinde.</span></div><span></span></div></div></section></div>'+
   '<section class="panel"><div class="ph"><h2>Bölgesel tedarik görünümü</h2><span class="foot">Anonim, örnek veri</span></div><div class="tblw"><table><thead><tr><th>Bölge</th><th class="n">Aktif tedarikçi</th><th class="n">Ortalama teslim</th><th class="n">Fiyat (Marmara = 100)</th><th class="n">Ortalama endeks</th></tr></thead><tbody>'+
   [['Marmara',38,11,100,88],['Ege',21,12,98,84],['İç Anadolu',14,14,96,82],['Akdeniz',9,13,99,85],['İthalat · AB',6,22,104,91]].map(function(r){return '<tr><td>'+r[0]+'</td><td class="n">'+r[1]+'</td><td class="n">'+r[2]+' gün</td><td class="n">'+r[3]+'</td><td class="n">'+r[4]+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  el('pCat').querySelectorAll('button').forEach(function(b){b.onclick=function(){st.kCat=b.dataset.k;render()}});
  var step=(hi-lo)/2;lineChart(el('pChart'),v.map(function(x,i){return {l:MONTHS[i],v:x}}),{lo:lo,hi:hi,ticks:[lo,lo+step,hi],dec:1,label:'Fiyat endeksi',every:1});
}

/* ================= Entegrasyonlar ve roller ================= */

   '<div class="g3">'+I.map(function(x){var s=lbl[st.integ[x[0]]];return '<section class="panel"><div class="ph"><h2>'+x[1]+'</h2><span class="pill '+s[0]+'">'+s[1]+'</span></div><span class="tag" style="align-self:flex-start">'+x[2]+'</span><p class="foot">'+x[3]+'</p><div class="acts">'+(st.integ[x[0]]==='on'?'<span class="foot">Son eşitleme '+fdt(new Date(TODAY.getTime()-36e5))+'</span>':'<button class="btn sm br" data-i="'+x[0]+'">Bağla</button>')+'</div></section>'}).join('')+'</div>'+
   '<div class="g2"><section class="panel"><div class="ph"><h2>Veri akışı</h2></div><div class="tblw"><table><thead><tr><th>Olay</th><th>Yön</th><th>Sistem</th></tr></thead><tbody>'+
   [['Satın alma talebi','ERP → SolChain','ERP'],['Sipariş ve koşullar','SolChain → ERP','ERP'],['Sevk belgesi','Entegratör → SolChain','e-İrsaliye'],['Mal kabul ve kalite','SolChain → ERP, LIMS','ERP, laboratuvar'],['Fatura','Entegratör ↔ SolChain','e-Fatura'],['Ödeme ve iade','Ödeme kuruluşu ↔ SolChain','Ödeme'],['Karne ve risk olayları','SolChain → webhook','API']].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join('')+'</tbody></table></div></section>'+
   '<section class="panel"><div class="ph"><h2>Roller ve yetkiler</h2></div><div class="tblw"><table><thead><tr><th>Rol</th><th>İmzalayabildiği adımlar</th></tr></thead><tbody>'+
   [['Satın alma uzmanı','Teklif talebi, teklif karşılaştırma'],['Satın alma müdürü','Sipariş onayı (limit dahilinde), tedarikçi onayı'],['Kalite','Giriş kalite kontrolü, itiraz, saha geri bildirimi'],['Depo / mal kabul','Teslim alındı imzası'],['Finans','Ödeme güvencesi, erken tahsilat onayı'],['Yönetici','Kullanıcılar, limitler, entegrasyonlar']].map(function(r){return '<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td></tr>'}).join('')+'</tbody></table></div><p class="foot">İmzalar firmaya ait çoklu imzalı hesaplar veya donanım güvenlik modülleri üzerinden atılır; kullanıcıların kripto cüzdan bilgisi gerekmez. Tüm işlemler denetim kaydı olarak saklanır.</p></section></div>';
  V.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){st.integ[b.dataset.i]='on';toast('Bağlantı kuruldu (prototip simülasyonu).');render()}});
}

setInterval(function(){st.slot+=1;var s=el('slot');if(s)s.textContent='Slot '+fmt(st.slot)},450);
route();
})();
